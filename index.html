<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Brand ---------------------------------------------------------- -->
    <title>LIGHTH00K — Private Cinema</title>
    <meta
      name="description"
      content="LIGHTH00K is the household's private cinema. A hand-built shelf of films and series, made for the living room."
    />
    <meta name="application-name" content="LIGHTH00K" />

    <!-- Warm midnight shell; matches --bg so install splash and browser
         chrome never flash a different colour. -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0806" />
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no, url=no" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Link previews (the app is private, but a clean card costs nothing) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="LIGHTH00K — Private Cinema" />
    <meta
      property="og:description"
      content="The household's own screening room. Films, series and a ginger cat on the door."
    />
    <meta property="og:image" content="https://lighthook.netlify.app/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="LIGHTH00K — Private Cinema" />
    <meta
      name="twitter:description"
      content="The household's own screening room. Films, series and a ginger cat on the door."
    />
    <meta name="twitter:image" content="https://lighthook.netlify.app/icons/icon-512.png" />

    <!-- iOS standalone launch ------------------------------------------ -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LIGHTH00K" />

    <!-- Manifest + icons (binaries live in public/icons) --------------- -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="mask-icon" href="/icons/favicon.svg" color="#e9a05a" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />

    <!-- Type: self-hosted, so the shelf keeps its voice offline --------- -->
    <link rel="preload" href="/fonts/bricolage-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />

    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <link rel="preconnect" href="https://api.themoviedb.org" crossorigin />
    <link rel="dns-prefetch" href="https://image.tmdb.org" />
    <link rel="dns-prefetch" href="https://api.themoviedb.org" />

    <style>
      /* Paint the shell before the bundle and stylesheet arrive so a cold start
         (and the standalone launch) never flashes white. */
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        background-color: #0a0806;
      }
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        -webkit-tap-highlight-color: transparent;
      }
      body,
      #root {
        min-height: 100vh;
        min-height: 100dvh;
      }

      /* Cold-start veil: a warm lamp while React mounts. */
      #root:empty::after {
        content: "";
        position: fixed;
        left: 50%;
        top: 50%;
        width: 9px;
        height: 9px;
        margin: -4.5px 0 0 -4.5px;
        border-radius: 50%;
        background: #e9a05a;
        animation: shell-pulse 1.6s ease-out infinite;
      }
      @keyframes shell-pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(233, 160, 90, 0.5);
          opacity: 1;
        }
        70% {
          box-shadow: 0 0 0 24px rgba(233, 160, 90, 0);
          opacity: 0.5;
        }
        100% {
          box-shadow: 0 0 0 0 rgba(233, 160, 90, 0);
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #root:empty::after {
          animation: none;
        }
      }

      /* Client-rendered app: this panel is the whole UI when JS is off. */
      .noscript-shell {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        padding: 24px;
        padding: max(24px, env(safe-area-inset-top)) 24px
          max(24px, env(safe-area-inset-bottom));
        background: radial-gradient(120% 90% at 50% 0%, #1b130b 0%, #0a0806 64%);
        color: #f6efe3;
        font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          sans-serif;
        text-align: center;
      }
      .noscript-card {
        max-width: 36ch;
      }
      .noscript-beam {
        width: 46px;
        height: 2px;
        margin: 0 auto 20px;
        border-radius: 2px;
        background: linear-gradient(90deg, transparent, #e9a05a, transparent);
        box-shadow: 0 0 20px rgba(233, 160, 90, 0.6);
      }
      .noscript-mark {
        margin: 0;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: #e9a05a;
      }
      .noscript-card h1 {
        margin: 14px 0 10px;
        font-size: 22px;
        line-height: 1.25;
        font-weight: 650;
        letter-spacing: -0.01em;
      }
      .noscript-card p {
        margin: 0;
        font-size: 15px;
        line-height: 1.55;
        color: #b4a690;
      }
      .noscript-card p + p {
        margin-top: 12px;
        font-size: 13.5px;
        color: #7e7263;
      }
      .noscript-card a {
        color: #e9a05a;
        text-decoration: none;
        border-bottom: 1px solid rgba(233, 160, 90, 0.42);
      }
      .noscript-card a:hover {
        color: #ffc78e;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div class="noscript-shell" role="alert">
        <div class="noscript-card">
          <div class="noscript-beam" aria-hidden="true"></div>
          <p class="noscript-mark">LIGHTH00K</p>
          <h1>JavaScript is switched off</h1>
          <p>
            This cinema renders in your browser, so it can't start without
            JavaScript. Enable it for this site, then
            <a href="/">open the doors again</a>.
          </p>
          <p>
            If you already installed LIGHTH00K to your home screen, launch it
            from there instead.
          </p>
        </div>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
